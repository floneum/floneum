name: Symbolic GEMV regression
on:
  push:
    branches: [codex/symbolic-gemv-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      FUSOR_CONFORMANCE_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 90fe019d51abff401f036f79044c13c5d22b9cf9
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: symbolic-gemv-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-${{ github.sha }}
          restore-keys: symbolic-gemv-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-
      - name: Validate the compiler fix with GPU validation
        env:
          FUSOR_TRACE_DISPATCH: '1'
          MTL_DEBUG_LAYER: '1'
          FUSOR_WGSL_DUMP: ${{ github.workspace }}/diagnostics
        run: cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --features compiler-tests --lib symbolic_softmax_gemv_materializations_agree -- --nocapture --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbolic-gemv-synthetic-shaders
          path: diagnostics
          retention-days: 3
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: symbolic-gemv-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-${{ github.sha }}
