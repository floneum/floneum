name: Symbolic GEMV regression
on:
  push:
    branches: [codex/symbolic-gemv-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      FUSOR_CONFORMANCE_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d9b0795395b4624f3d24f3b37be97874ea039e48
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: symbolic-gemv-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-${{ github.sha }}
          restore-keys: symbolic-gemv-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-
          save-always: true
      - name: Isolate symbolic tail arithmetic
        run: cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --features compiler-tests --lib symbolic_gemv_tail_schedules_agree -- --nocapture --test-threads=1
