name: Compiler candidate release binary

on:
  push:
    branches: [codex/compiler-profile-builds]

permissions:
  contents: read

concurrency:
  group: compiler-profile-builds
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e38d453c3f8072f20f0ed40c46b42586d458ca0b
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify deferred host backing without a GPU
        run: |
          python3 --version
          python3 -m unittest discover -s fusor/fusor-visualize/tools -p 'test_*.py' -q
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir --tests
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features cpu --lib layout_alternatives_materialize_only_when_borrowed
  release:
    needs: host
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/candidate-target
      CANDIDATE_REVISION: e38d453c3f8072f20f0ed40c46b42586d458ca0b
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          path: candidate
          fetch-depth: 3
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Prove the range-scatter regression and build small comparison fixtures
        working-directory: candidate
        shell: bash
        env:
          FUSOR_AUTOTUNE_MIN_MACS: '18446744073709551615'
          FUSOR_PROFILE_SUBMIT_SIZE: '2147483647'
          FUSOR_COMPILE_THREADS: '1'
          FUSOR_EXPLORE_EPS: '0'
        run: |
          set -euo pipefail
          mkdir -p ../fixture-artifacts
          lower=fusor/fusor-gpu/src/lower/gather_scatter.rs
          cp "$lower" ../range-scatter-candidate.rs
          trap 'cp ../range-scatter-candidate.rs "$lower"' EXIT
          git show 519774bc9:"$lower" > "$lower"
          set +e
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --lib consecutive_scatter_uses_direct_indices_and_preserves_sources --config profile.dev.opt-level=0 --config profile.dev.debug=0 -- --ignored --test-threads=1 > ../fixture-artifacts/baseline-regression.txt 2>&1
          red=$?
          set -e
          cat ../fixture-artifacts/baseline-regression.txt
          test "$red" -ne 0
          grep -E 'direct range lowering was not selected|consecutive indices still scanned' ../fixture-artifacts/baseline-regression.txt
          cargo build --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --example affine_copy_lab --config profile.dev.opt-level=0 --config profile.dev.debug=0
          cp "$CARGO_TARGET_DIR/debug/examples/affine_copy_lab" ../fixture-artifacts/affine-copy-baseline
          ../fixture-artifacts/affine-copy-baseline > ../fixture-artifacts/baseline.out 2> ../fixture-artifacts/baseline.err || { cat ../fixture-artifacts/baseline.out ../fixture-artifacts/baseline.err; exit 1; }
          cp ../range-scatter-candidate.rs "$lower"
          trap - EXIT
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --lib consecutive_scatter_uses_direct_indices_and_preserves_sources --config profile.dev.opt-level=0 --config profile.dev.debug=0 -- --ignored --test-threads=1
          cargo build --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer --example affine_copy_lab --example qmatmul_lab --example vector_lab --config profile.dev.opt-level=0 --config profile.dev.debug=0
          cp "$CARGO_TARGET_DIR/debug/examples/affine_copy_lab" ../fixture-artifacts/affine-copy-candidate
          cp "$CARGO_TARGET_DIR/debug/examples/qmatmul_lab" ../fixture-artifacts/qmatmul-lab-candidate
          cp "$CARGO_TARGET_DIR/debug/examples/vector_lab" ../fixture-artifacts/vector-lab-candidate
          LAB_EXPECT_DIRECT_RANGE=1 ../fixture-artifacts/affine-copy-candidate > ../fixture-artifacts/candidate.out 2> ../fixture-artifacts/candidate.err || { cat ../fixture-artifacts/candidate.out ../fixture-artifacts/candidate.err; exit 1; }
          git diff --exit-code
          shasum -a 256 ../fixture-artifacts/* > ../fixture-artifacts/sha256.txt
      - name: Package small compiler fixtures
        if: always()
        run: tar -czf compiler-small-fixtures.tar.gz -C fixture-artifacts .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-small-fixtures-macos
          path: compiler-small-fixtures.tar.gz
          retention-days: 3
      - name: Validate shared host backing and compiler regressions
        working-directory: candidate
        run: |
          python3 --version
          python3 -m unittest discover -s fusor/fusor-visualize/tools -p 'test_*.py' -q
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir --test known_index_bits
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir -p fusor-tile -p fusor-cost -p fusor --lib --features fusor/kernel-observer,fusor/compiler-tests -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --test candidate_construction --features kernel-observer,compiler-tests -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --test shared_compiler --features kernel-observer,compiler-tests -- --ignored --test-threads=1
          cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
          python3 -m unittest discover -s fusor/fusor-visualize/tools -p 'test_*.py' -q
      - name: Build default-release candidate in its own target directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          {
            rustc -Vv
            uname -m
            xcrun --show-sdk-version
            git -C candidate rev-parse HEAD
            shasum -a 256 candidate/models/kalosm-llama/examples/profile_forward.rs
            echo 'cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin'
            echo 'Reference binaries: CI run 39092226768; base 7a9ead2493b31ef670a35ed0507de1188006329e; prior candidate f927525bdde3ede996bb29647b377d2ebf10a385'
          } > artifacts/build.txt
          (
            cd candidate
            cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin
          )
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/examples/profile_forward" artifacts/profile-forward-candidate
          shasum -a 256 artifacts/profile-forward-candidate >> artifacts/build.txt
      - name: Package binary with executable permissions
        run: tar -czf compiler-profile-binaries.tar.gz -C artifacts .
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-profile-binaries-macos
          path: compiler-profile-binaries.tar.gz
          retention-days: 3
