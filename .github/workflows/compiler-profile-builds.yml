name: Compiler candidate release binary

on:
  push:
    branches: [codex/compiler-profile-builds]

permissions:
  contents: read

concurrency:
  group: compiler-profile-builds
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f3ffe0bcefe04c1a2f3bb6f3cb355748a7afe0e5
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify deferred host backing without a GPU
        run: |
          python3 --version
          python3 -m unittest discover -s fusor/fusor-visualize/tools -p 'test_*.py' -q
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir --tests
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features cpu --lib layout_alternatives_materialize_only_when_borrowed
  release:
    needs: host
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/candidate-target
      CANDIDATE_REVISION: f3ffe0bcefe04c1a2f3bb6f3cb355748a7afe0e5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Validate shared host backing and compiler regressions
        working-directory: candidate
        run: |
          python3 --version
          python3 -m unittest discover -s fusor/fusor-visualize/tools -p 'test_*.py' -q
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir --test known_index_bits
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir -p fusor-tile -p fusor-cost -p fusor --lib --features fusor/kernel-observer,fusor/compiler-tests -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --test candidate_construction --features kernel-observer,compiler-tests -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --test shared_compiler --features kernel-observer,compiler-tests -- --ignored --test-threads=1
          cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
          python3 -m unittest discover -s fusor/fusor-visualize/tools -p 'test_*.py' -q
      - name: Build default-release candidate in its own target directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          {
            rustc -Vv
            uname -m
            xcrun --show-sdk-version
            git -C candidate rev-parse HEAD
            shasum -a 256 candidate/models/kalosm-llama/examples/profile_forward.rs
            echo 'cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin'
            echo 'Reference binaries: CI run 39092226768; base 7a9ead2493b31ef670a35ed0507de1188006329e; prior candidate f927525bdde3ede996bb29647b377d2ebf10a385'
          } > artifacts/build.txt
          (
            cd candidate
            cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin
          )
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/examples/profile_forward" artifacts/profile-forward-candidate
          shasum -a 256 artifacts/profile-forward-candidate >> artifacts/build.txt
      - name: Package binary with executable permissions
        run: tar -czf compiler-profile-binaries.tar.gz -C artifacts .
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-profile-binaries-macos
          path: compiler-profile-binaries.tar.gz
          retention-days: 3
