name: Shared upload reclamation validation and release
on:
  push:
    branches: [codex/upload-reclaim-green]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c901c00d35871c11e16873a299cf5d99dd8cc803
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fusor -> target
          shared-key: upload-reclaim-host
      - run: cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir -p fusor-gguf --lib -- --test-threads=1
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features cpu --lib uploaded_leaves_release_host_pages_cpu -- --test-threads=1
  gpu:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FUSOR_CONFORMANCE_REQUIRE_GPU: '1'
      FUSOR_COMPILE_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c901c00d35871c11e16873a299cf5d99dd8cc803
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fusor/target
          key: upload-reclaim-green-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}
          restore-keys: upload-reclaim-red-${{ runner.os }}-
      - name: Check backing lifetime and real CPU/WebGPU uploads
        run: |
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir -p fusor-gguf --lib -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer,compiler-tests --lib -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --no-default-features --features gpu,kernel-observer,compiler-tests --test shared_compiler -- --ignored --test-threads=1
          cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
  release:
    needs: [host, gpu]
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/model-release-target
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c901c00d35871c11e16873a299cf5d99dd8cc803
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            model-release-target
          key: upload-reclaim-model-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: workgroup-model-${{ runner.os }}-
      - name: Build default release profiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          {
            rustc -Vv
            git rev-parse HEAD
            shasum -a 256 models/kalosm-llama/examples/profile_forward.rs models/kalosm-llama/src/model/inference.rs
            echo 'cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin'
          } > artifacts/provenance.txt
          cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/examples/profile_forward" artifacts/profile-forward-reclaim
          shasum -a 256 artifacts/profile-forward-reclaim >> artifacts/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upload-reclaim-default-release
          path: artifacts
          retention-days: 3
