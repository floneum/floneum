name: Shared gather epilogue regression

on:
  push:
    branches: [codex/gather-profile-builds]

permissions:
  contents: read

concurrency:
  group: gather-profile-builds
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 01164b16bd6330a7ccd1638372d93e07eb8b8dcf
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate general gather construction and host execution
        run: |
          mkdir artifacts
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --test candidate_construction --features kernel-observer,compiler-tests -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --test shared_compiler --features kernel-observer,compiler-tests -- --test-threads=1
      - name: Validate shared WebGPU execution
        run: |
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --test shared_compiler --features kernel-observer,compiler-tests -- --ignored --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor-ir -p fusor-tile -p fusor-cost --lib -- --test-threads=1
          cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
      - name: Build bounded candidate fixture
        run: |
          cargo build --locked --manifest-path fusor/Cargo.toml -p fusor --features kernel-observer --example indexed_map_lab
          cp target/debug/examples/indexed_map_lab artifacts/indexed-map-lab-candidate
          git rev-parse HEAD > artifacts/candidate-revision.txt
          shasum -a 256 artifacts/indexed-map-lab-candidate > artifacts/sha256.txt
          rustc -Vv > artifacts/toolchain.txt
          tar -czf gather-candidate-fixture.tar.gz -C artifacts .
      - uses: actions/upload-artifact@v4
        with:
          name: gather-candidate-fixture-macos
          path: gather-candidate-fixture.tar.gz
          retention-days: 3
      - name: Build token-accurate default release
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/model-release-target"
          mkdir model-artifacts
          {
            rustc -Vv
            uname -m
            xcrun --show-sdk-version
            git rev-parse HEAD
            shasum -a 256 models/kalosm-llama/examples/profile_forward.rs models/kalosm-llama/src/model/inference.rs
            echo 'cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin'
          } > model-artifacts/gather-model-build.txt
          cargo build --locked -j 1 -p kalosm-llama --example profile_forward --release --target aarch64-apple-darwin
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/examples/profile_forward" model-artifacts/profile-forward-gather
          shasum -a 256 model-artifacts/profile-forward-gather >> model-artifacts/gather-model-build.txt
          tar -czf gather-model-release.tar.gz -C model-artifacts .
      - uses: actions/upload-artifact@v4
        with:
          name: gather-model-release-macos
          path: gather-model-release.tar.gz
          retention-days: 3
