name: Declared compute workgroup validation
on:
  push:
    branches: [codex/workgroup-fix-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      FUSOR_CONFORMANCE_REQUIRE_GPU: '1'
      MTL_DEBUG_LAYER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 47bf132317225478b342bc8af3e7a8ae331eb198
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workgroup-fix-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            symbolic-gemv-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-
            symbolic-gemv-${{ runner.os }}-
      - name: Validate extracted plans and shared compiler regressions
        run: |
          cargo fmt --manifest-path fusor/Cargo.toml --all -- --check
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --features compiler-tests --lib -- --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --features kernel-observer,compiler-tests --test shared_compiler -- --include-ignored --test-threads=1
          cargo test --locked --manifest-path fusor/Cargo.toml -p fusor --features kernel-observer,compiler-tests --test candidate_construction -- --test-threads=1
          cargo build --locked --manifest-path fusor/Cargo.toml -p fusor-conformance
      - name: Validate original attention failures and backward suite
        run: |
          target/debug/fusor-conformance attention_rope::
          target/debug/fusor-conformance backward::
      - name: Lint the shared compiler
        run: cargo clippy --locked --manifest-path fusor/Cargo.toml --workspace --all-targets --features fusor/kernel-observer,fusor/compiler-tests -- -D warnings
      - uses: actions/checkout@v6
        with:
          repository: ealmloff/wgpu
          ref: dc256a91cca0619603a4fe5899516cc3772e7d2a
          path: dependency
          persist-credentials: false
      - name: Validate translator and regenerate compiler snapshots
        run: |
          cargo test --locked --manifest-path dependency/Cargo.toml -p naga --all-features --lib -- --test-threads=1
          cargo test --locked --manifest-path dependency/Cargo.toml -p naga --all-features --test naga snapshots:: -- --test-threads=1
          git -C dependency diff -- naga/tests/out/msl > naga-workgroup-snapshots.patch
      - uses: actions/upload-artifact@v4
        with:
          name: naga-workgroup-snapshots
          path: naga-workgroup-snapshots.patch
          retention-days: 3
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workgroup-fix-${{ runner.os }}-${{ hashFiles('fusor/Cargo.lock') }}-${{ github.sha }}
